# Standalone crate (own `[workspace]`) so it is NOT pulled into the
# peerline workspace's default build — a consuming app's `src-tauri`
# path-depends on it. Keeps `tauri` out of peerline's lib/CI build.
[workspace]

[package]
name = "tauri-plugin-peerline-iroh"
version = "0.0.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tauri plugin: the dial side of a peerline-over-Iroh P2P transport. Pairs with any service's iroh acceptor; shares the wire contract via the peerline-iroh crate. Service-neutral — the ALPN is supplied per connect."
build = "build.rs"
# Required by `tauri_plugin::Builder` (build.rs) to emit plugin metadata.
links = "tauri-plugin-peerline-iroh"

[lib]
name = "tauri_plugin_peerline_iroh"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "io-util"] }
futures = "0.3"
tracing = "0.1"
iroh = "1"
# The shared wire contract (ticket codec, text framing) — the same crate
# the accepting service's iroh frontend uses, so the two ends can't drift.
peerline-transport-iroh = { path = "../peerline-transport-iroh" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
