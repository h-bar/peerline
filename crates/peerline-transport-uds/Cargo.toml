[package]
name = "peerline-transport-uds"
description = "Unix-domain-socket transport for peerline — a reusable accept-loop (`serve`) that drives a peerline `Peer` per connection over newline-delimited JSON frames. For local tooling on one host."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["rpc", "unix-socket", "ipc", "transport", "peerline"]
categories = ["network-programming", "asynchronous"]

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["fs", "net", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
# `Peer` (one per connection) + the canonical frame-size ceiling.
peerline = { workspace = true, features = ["runtime"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
