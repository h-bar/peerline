"$schema" = "schemas/schema.json"

[default]
description = "Allows dialing, framing, closing, and inspecting a peerline-over-Iroh P2P transport, plus decoding/probing a ticket."
permissions = [
    "allow-connect",
    "allow-send",
    "allow-close",
    "allow-connection-status",
    "allow-inspect-ticket",
    "allow-probe-ticket",
]
