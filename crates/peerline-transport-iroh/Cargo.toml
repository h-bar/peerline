[package]
name = "peerline-transport-iroh"
description = "Iroh P2P (QUIC) transport for peerline — ticket codec, text framing, and a reusable accept-loop (`serve`) that drives a peerline `Peer` per bi-stream. The ALPN is caller-supplied so one host can run several peerline services behind a single endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rpc", "p2p", "quic", "iroh", "peerline"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# `iroh` drives the endpoint / accept loop; `iroh-base` supplies the
# `SecretKey` + `EndpointAddr` the ticket encodes. Keep the major pinned
# so the serialization stays compatible across both ends; the `key`
# feature gates those types.
iroh = "1"
iroh-base = { version = "1", features = ["key"] }
data-encoding = "2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["io-util", "rt", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
# `Peer` (the accept loop drives one per bi-stream) + the canonical
# frame-size ceiling ([`peerline::MAX_FRAME_LEN`]).
peerline = { workspace = true, features = ["runtime"] }

[dev-dependencies]
serde_json = "1"
# Only for examples/diagnostics (e.g. `offlan_repro`): a subscriber so
# RUST_LOG surfaces iroh's internal path/relay tracing.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
