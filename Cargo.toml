# Virtual workspace root. Every crate lives under `crates/`; nothing is
# published from here.
#
# `peerline` is the protocol: wire envelopes, the peer runtime and the pubsub
# layer. The transport crates carry it over WebSocket / Unix sockets / iroh.
# The conformance suite — the golden vectors, the shared battery and the
# cross-language interop harness — lives in the sibling `peerline-conformance`
# repository, which depends on this one.
#
# The TypeScript implementation of the same protocol is the sibling
# `peerline-ts` repository; the suite above checks the two against each other.
#
# The service layer that builds on this — the `Service` trait, the
# multi-transport `Host` and the `peerline-manager` registry — lives in the
# sibling `peerline-host` repository.
[workspace]
members = [
    "crates/peerline",
    "crates/peerline-transport-ws",
    "crates/peerline-transport-uds",
    "crates/peerline-transport-iroh",
]
resolver = "2"

# Shared by every member, so a release bumps one line rather than five.
[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/h-bar/peerline"

# Every internal dependency is declared here with both a path and a version:
# the path is what a workspace build uses, the version is what `cargo package`
# writes into the published manifest. A path dependency without a version
# cannot be packaged at all.
[workspace.dependencies]
peerline = { path = "crates/peerline", version = "0.0.6" }
peerline-transport-ws = { path = "crates/peerline-transport-ws", version = "0.0.6" }
peerline-transport-uds = { path = "crates/peerline-transport-uds", version = "0.0.6" }
peerline-transport-iroh = { path = "crates/peerline-transport-iroh", version = "0.0.6" }
