[package]
name = "peerline-manager"
description = "A live registry of the peerline services running on a host — itself a peerline service. Hosts register their dial coordinates over peerline and heartbeat to stay live (TTL-expired otherwise); clients query `manager.list` / `manager.lookup`. Reachable over any transport the host mounts it on. Ships a web dashboard and a `peerline-mon` CLI."
version = "0.0.6"
edition = "2024"
license = "MIT"

# The manager daemon (also serves the web dashboard).
[[bin]]
name = "peerline-manager"
path = "src/main.rs"

# A terminal frontend that lists/watches the registry.
[[bin]]
name = "peerline-mon"
path = "src/bin/peerline-mon.rs"

[dependencies]
peerline = { path = "../..", features = ["runtime"] }
peerline-manager-protocol = { path = "../peerline-manager-protocol" }
serde_json = "1"
tracing = "0.1"
# The daemon runs the Manager on a Host over uds (+ optional ws for browsers).
peerline-host = { path = "../peerline-host", default-features = false, features = ["uds", "ws"] }
# Dial transports for the `peerline-mon` CLI client.
peerline-transport-uds = { path = "../peerline-transport-uds" }
peerline-transport-ws = { path = "../peerline-transport-ws" }
# Serves the web dashboard (static page) from the manager binary.
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
futures = "0.3"
